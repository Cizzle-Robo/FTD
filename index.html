<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pallet Defenders: Co-Op Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            background: radial-gradient(circle, #6dd5ed 0%, #2193b0 100%);
            color: #fff; font-family: 'Fredoka One', cursive, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 0; min-height: 100vh;
            overflow: hidden; 
        }
        
        /* --- BTD6 STYLE MENU --- */
        #btd6-menu {
            width: 100vw; height: 100vh;
            background: url('https://www.transparenttextures.com/patterns/cubes.png'), radial-gradient(circle, #6dd5ed 0%, #2193b0 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; z-index: 100;
        }

        .menu-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; animation: popIn 0.3s ease-out; }
        .menu-screen.active { display: flex; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .game-title {
            font-size: 72px; margin-bottom: 40px; color: #f1c40f; text-align: center;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 10px 0 #c23616; letter-spacing: 3px;
        }

        .btd-btn {
            font-family: 'Fredoka One'; border: none; cursor: pointer; border-radius: 20px;
            color: white; text-transform: uppercase; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            transition: all 0.1s ease; position: relative;
        }
        .btd-btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent !important; }

        .btn-play { background-color: #51d02e; font-size: 56px; padding: 20px 80px; border: 8px solid #3fa224; box-shadow: 0 12px 0 #2e7a19, 0 15px 20px rgba(0,0,0,0.5); border-radius: 40px; margin-bottom: 20px; }
        .btn-play:hover { background-color: #61e83b; transform: translateY(-2px); box-shadow: 0 14px 0 #2e7a19, 0 20px 25px rgba(0,0,0,0.5); }

        .side-btns { display: flex; gap: 20px; margin-top: 10px; }
        .btn-coop { background-color: #3498db; font-size: 28px; padding: 15px 40px; border: 6px solid #2980b9; box-shadow: 0 8px 0 #1f618d, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-coop:hover { background-color: #5dade2; transform: translateY(-2px); box-shadow: 0 10px 0 #1f618d; }
        .btn-hero { background-color: #9b59b6; font-size: 28px; padding: 15px 40px; border: 6px solid #8e44ad; box-shadow: 0 8px 0 #6c3483, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-hero:hover { background-color: #af7ac5; transform: translateY(-2px); box-shadow: 0 10px 0 #6c3483; }

        .wood-panel {
            background: #8b5a2b; border: 8px solid #5c3a21; box-shadow: 0 15px 0 #3e2717, 0 20px 20px rgba(0,0,0,0.5);
            border-radius: 25px; padding: 30px; text-align: center; width: 800px; max-width: 90vw; position: relative;
        }
        .wood-panel h2 { margin-top: 0; color: #fdf5e6; font-size: 36px; text-shadow: 3px 3px 0 #000; border-bottom: 4px dashed #5c3a21; padding-bottom: 10px; }

        .btn-back { background-color: #e74c3c; font-size: 20px; padding: 10px 25px; border: 4px solid #c0392b; box-shadow: 0 6px 0 #922b21; position: absolute; top: -20px; left: -20px; border-radius: 15px; z-index: 10; }
        .btn-back:hover { background-color: #f1948a; }

        .selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .card-btn { background-color: #fdf5e6; border: 6px solid #deb887; color: #333; padding: 20px 10px; cursor: pointer; border-radius: 15px; font-family: 'Fredoka One'; font-size: 20px; box-shadow: 0 8px 0 #cda470; transition: all 0.1s; text-shadow: none; }
        .card-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #cda470; }
        .card-btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
        .card-btn.active { border-color: #2ecc71; background-color: #eafaf1; box-shadow: 0 8px 0 #27ae60; }
        .card-btn span { display: block; font-size: 14px; color: #7f8c8d; margin-top: 8px; }
        
        .diff-badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 12px; color: white; text-shadow: 1px 1px 0 #000; margin-top: 5px; }
        .diff-easy { background: #2ecc71; } .diff-med { background: #f39c12; } .diff-hard { background: #e74c3c; } .diff-expert { background: #8e44ad; }

        .coop-input-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        #join-id { padding: 15px; border-radius: 12px; border: 4px solid #5c3a21; font-family: 'Fredoka One'; font-size: 24px; text-align: center; width: 200px; text-transform: uppercase; }

        /* --- BTD6 IN-GAME UI --- */
        #game-wrapper {
            width: 100vw; height: 100vh; display: none; align-items: center; justify-content: center; 
            background: url('https://www.transparenttextures.com/patterns/cubes.png'), radial-gradient(circle, #2980b9 0%, #2c3e50 100%);
        }

        #game-container {
            display: flex; flex-direction: row; align-items: stretch;
            transform-origin: center center;
            border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border: 8px solid #233140; overflow: hidden; width: 1100px; height: 550px;
            background: #a3cb38;
        }

        /* Top Bar hovering over canvas */
        #game-main { position: relative; width: 800px; display: flex; flex-direction: column; }
        
        #top-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; box-sizing: border-box; z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
            pointer-events: none;
        }
        
        .stat-group { display: flex; gap: 20px; pointer-events: auto; }
        .top-stat {
            background: #8b5a2b; border: 4px solid #5c3a21; border-radius: 15px;
            padding: 4px 15px; font-size: 20px; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 0 #3e2717; text-shadow: 1px 1px 0 #000;
        }
        .health-text { color: #e74c3c; font-size: 24px; line-height: 1; }
        .money-text { color: #f1c40f; }

        .settings-btn-small {
            background: #7f8c8d; border: 4px solid #5c3a21; border-radius: 12px;
            font-size: 24px; padding: 4px 10px; cursor: pointer; color: white;
            box-shadow: 0 4px 0 #3e2717; transition: 0.1s; pointer-events: auto;
        }
        .settings-btn-small:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        canvas { display: block; position: absolute; top: 0; left: 0; cursor: crosshair; }

        /* Wood Sidebar */
        #game-sidebar {
            width: 300px; display: flex; flex-direction: column;
            background: #c18b57; border-left: 8px solid #5c3a21;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5); z-index: 20; position: relative;
        }

        /* Tower Selection Grid - FIXED SQUISHING */
        #tower-controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; 
            padding: 15px; overflow-y: auto; flex: 1; align-content: start; /* Packs items to the top */
        }
        
        /* Square Tower Cards - Added Names */
        .tower-card {
            background: #fdf5e6; border: 5px solid #deb887; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            cursor: pointer; box-shadow: 0 5px 0 #cda470; transition: 0.1s;
            padding: 8px 5px; position: relative; overflow: hidden; height: 110px; /* Fixed height instead of ratio */
        }
        .tower-card:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cda470; }
        .tower-card.active { border-color: #2ecc71; background: #eafaf1; box-shadow: 0 5px 0 #27ae60; }
        
        .tower-card-name { font-size: 11px; color: #333; text-align: center; font-weight: bold; margin-bottom: 5px; text-shadow: none; line-height: 1.1; }
        .tower-color-block { width: 40px; height: 40px; border-radius: 8px; border: 3px solid #2c3e50; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; }
        .tower-card-price { background: #2c3e50; color: #f1c40f; font-size: 13px; padding: 2px 8px; border-radius: 5px; text-shadow: 1px 1px 0 #000; width: 100%; box-sizing: border-box; text-align: center; }

        /* Upgrade Panel */
        #upgrade-panel { 
            display: none; flex: 1; background: #c18b57; padding: 15px; 
            box-sizing: border-box; flex-direction: column; gap: 10px; 
        }

        .upgrade-header { display: flex; align-items: center; justify-content: space-between; background: #8b5a2b; border: 4px solid #5c3a21; padding: 10px; border-radius: 12px; box-shadow: 0 4px 0 #3e2717;}
        .upgrade-title { flex: 1; text-align: center; font-size: 18px; text-shadow: 1px 1px 0 #000; }
        .btn-back-small { background: #e74c3c; border: none; color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-family: 'Fredoka One'; font-size: 16px; box-shadow: 0 3px 0 #c0392b; }
        .btn-back-small:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }

        #upgrade-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        
        /* BTD6 Style Upgrade Row (Clickable) */
        .path-row { 
            background: #51d02e; border: 4px solid #3fa224; border-radius: 12px; padding: 10px 12px; 
            display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 5px 0 #2e7a19;
            transition: 0.1s; text-shadow: 1px 1px 0 #000;
        }
        .path-row:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #2e7a19; }
        .path-row:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
        
        .path-row.locked { background: #7f8c8d; border-color: #606b6b; box-shadow: 0 5px 0 #4a5252; cursor: not-allowed; opacity: 0.8; }
        .path-row.locked:active { transform: none; box-shadow: 0 5px 0 #4a5252; }
        .path-row.maxed { background: #f1c40f; border-color: #d35400; box-shadow: 0 5px 0 #a04000; cursor: not-allowed; }
        .path-row.maxed:active { transform: none; box-shadow: 0 5px 0 #a04000; }
        
        .path-row-top { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .tier-dots { color: #fdf5e6; font-size: 12px; letter-spacing: 3px; text-shadow: none; margin-top: 5px;}

        .sell-btn { background: #c0392b; border: 4px solid #922b21; color: white; font-family: 'Fredoka One'; padding: 12px; border-radius: 12px; cursor: pointer; text-shadow: 1px 1px 0 #000; box-shadow: 0 5px 0 #641e16; font-size: 18px; margin-top: auto; transition: 0.1s;}
        .sell-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        /* Play Button Area */
        .sidebar-bottom {
            background: #8b5a2b; border-top: 6px solid #5c3a21; padding: 15px; 
            display: flex; justify-content: flex-end; align-items: center;
        }
        
        .play-wave-btn {
            background: #51d02e; border: 4px solid #3fa224; border-radius: 50%;
            width: 70px; height: 70px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: white; cursor: pointer; box-shadow: 0 6px 0 #2e7a19;
            transition: 0.1s; text-shadow: 2px 2px 0 #000; padding-left: 6px;
        }
        .play-wave-btn:hover { background: #61e83b; transform: translateY(-2px); box-shadow: 0 8px 0 #2e7a19; }
        .play-wave-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
        .play-wave-btn:disabled { background: #7f8c8d; border-color: #606b6b; box-shadow: 0 6px 0 #4a5252; cursor: not-allowed; }

        /* Settings Modal */
        #settings-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 300; align-items: center; justify-content: center;
        }
        .settings-panel {
            background: #8b5a2b; border: 8px solid #5c3a21; box-shadow: 0 15px 0 #3e2717, 0 20px 20px rgba(0,0,0,0.5);
            border-radius: 25px; padding: 30px; text-align: center; width: 400px; max-width: 90vw;
            display: flex; flex-direction: column; gap: 20px;
        }
        .settings-panel h2 { margin-top: 0; color: #fdf5e6; font-size: 32px; text-shadow: 3px 3px 0 #000; border-bottom: 4px dashed #5c3a21; padding-bottom: 10px; }
        .quit-btn { width: 100%; padding: 15px; background: #c0392b; color: white; border: 4px solid #922b21; border-radius: 15px; font-family: 'Fredoka One'; cursor: pointer; box-shadow: 0 6px 0 #641e16; font-size: 20px; transition: 0.1s; }
        .quit-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent;}

        .xp-bar-container { width: 100%; background: #3e2717; border-radius: 10px; height: 20px; border: 2px solid #5c3a21; overflow: hidden; position: relative;}
        .xp-bar-fill { background: #9b59b6; height: 100%; width: 0%; transition: width 0.3s; }
        .xp-text { position: absolute; width: 100%; text-align: center; top: 0; font-family: 'Fredoka One'; font-size: 12px; line-height: 20px; text-shadow: 1px 1px 0 #000; }
    </style>
</head>
<body>

    <div id="btd6-menu">
        <div id="screen-home" class="menu-screen active">
            <h1 class="game-title">📦 PALLET<br>DEFENDERS</h1>
            <button class="btd-btn btn-play" onclick="navTo('screen-maps')">PLAY</button>
            <div class="side-btns">
                <button class="btd-btn btn-hero" onclick="navTo('screen-heroes')">HEROES</button>
                <button class="btd-btn btn-coop" onclick="navTo('screen-coop')">CO-OP</button>
            </div>
        </div>

        <div id="screen-heroes" class="menu-screen">
            <div class="wood-panel">
                <button class="btd-btn btn-back" onclick="navTo('screen-home')">◀ BACK</button>
                <h2>Choose Your Hero</h2>
                <div class="selection-grid">
                    <button class="card-btn active" id="hero-btn-0" onclick="setHero(0)">Foreman Fred<span>Buffs tower Speed</span></button>
                    <button class="card-btn" id="hero-btn-1" onclick="setHero(1)">Safety Sue<span>Massive AoE Damage</span></button>
                </div>
            </div>
        </div>

        <div id="screen-maps" class="menu-screen">
            <div class="wood-panel">
                <button class="btd-btn btn-back" onclick="navTo('screen-home')">◀ BACK</button>
                <h2>Select Map</h2>
                <div class="selection-grid">
                    <button class="card-btn" onclick="selectMap(0)">Serpentine<br><div class="diff-badge diff-easy">Beginner</div></button>
                    <button class="card-btn" onclick="selectMap(1)">Classic Aisle<br><div class="diff-badge diff-med">Intermediate</div></button>
                    <button class="card-btn" onclick="selectMap(3)">Loading Dock<br><div class="diff-badge diff-med">Intermediate</div></button>
                    <button class="card-btn" onclick="selectMap(2)">Express Lane<br><div class="diff-badge diff-hard">Advanced</div></button>
                    <button class="card-btn" onclick="selectMap(4)">Cold Storage<br><div class="diff-badge diff-hard">Advanced</div></button>
                    <button class="card-btn" onclick="selectMap(5)">Zig-Zag Shift<br><div class="diff-badge diff-expert">Expert</div></button>
                </div>
            </div>
        </div>

        <div id="screen-diff" class="menu-screen">
            <div class="wood-panel">
                <button class="btd-btn btn-back" onclick="navTo('screen-maps')">◀ MAPS</button>
                <h2>Select Difficulty</h2>
                <div class="selection-grid" style="grid-template-columns: repeat(3, 1fr);">
                    <button class="card-btn" onclick="selectDiff(0)" style="border-color:#2ecc71;">EASY<span>30 HP | $500 Start</span></button>
                    <button class="card-btn" onclick="selectDiff(1)" style="border-color:#3498db;">MEDIUM<span>20 HP | $400 Start</span></button>
                    <button class="card-btn" onclick="selectDiff(2)" style="border-color:#e74c3c;">HARD<span>10 HP | $300 Start</span></button>
                </div>
            </div>
        </div>

        <div id="screen-coop" class="menu-screen">
            <div class="wood-panel">
                <button class="btd-btn btn-back" onclick="navTo('screen-home')">◀ BACK</button>
                <h2>Co-Op Multiplayer</h2>
                <div class="coop-input-group">
                    <button class="btd-btn btn-play" style="font-size: 24px; padding: 15px 30px;" onclick="hostGame()">CREATE MATCH</button>
                </div>
                <h3 style="color:#fdf5e6; margin: 20px 0 5px 0;">OR JOIN FRIEND</h3>
                <div class="coop-input-group">
                    <input type="text" id="join-id" placeholder="CODE" maxlength="5">
                    <button class="btd-btn btn-coop" style="font-size: 20px; padding: 10px 20px;" onclick="joinGame()">JOIN</button>
                </div>
                <p id="network-status" style="color: #f1c40f; font-weight: bold; margin-top: 20px; font-size: 20px; text-shadow: 2px 2px 0 #000;"></p>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="game-main">
                <div id="top-ui">
                    <div class="stat-group">
                        <div class="top-stat"><span class="health-text">❤️</span> <span id="healthDisplay">20</span></div>
                        <div class="top-stat"><span class="money-text">💲</span> <span id="moneyDisplay">300</span></div>
                    </div>
                    <div class="stat-group">
                        <div class="top-stat" style="color: #ecf0f1;">Round <span id="waveDisplay" style="color: #3498db; margin-left: 5px;">1</span></div>
                        <button class="settings-btn-small" onclick="toggleSettings()">⚙️</button>
                    </div>
                </div>
                <canvas id="gameCanvas" width="800" height="550"></canvas>
            </div>
            
            <div id="game-sidebar">
                
                <div id="tower-controls"></div>
                
                <div id="upgrade-panel">
                    <div class="upgrade-header">
                        <button class="btn-back-small" onclick="deselectTower()">◀</button>
                        <strong class="upgrade-title" id="upgrade-title">Tower</strong>
                    </div>
                    <div id="upgrade-actions"></div>
                    <button id="sell-btn" class="sell-btn" onclick="sellSelectedTower()">Sell for $0</button>
                </div>

                <div class="sidebar-bottom">
                    <button id="play-wave-btn" class="play-wave-btn" onclick="startNextWave()">▶</button>
                </div>
            </div>
        </div>

        <div id="settings-modal">
            <div class="settings-panel">
                <h2>SETTINGS</h2>
                <button id="autoplay-btn" class="btd-btn" style="background:#e74c3c; border-color:#c0392b; font-size:24px; padding:15px;" onclick="toggleAutoPlay()">AUTO PLAY: OFF</button>
                <button class="btd-btn btn-play" style="font-size:24px; padding:15px; margin-bottom:10px;" onclick="toggleSettings()">RESUME</button>
                <button class="quit-btn" onclick="location.reload()">QUIT TO MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    // --- DOM & GLOBALS ---
    const btd6Menu = document.getElementById('btd6-menu');
    const gameWrapper = document.getElementById('game-wrapper');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let selectedMapIdx = 0, selectedDiffIdx = 1, selectedHeroIdx = 0;
    const TILE_SIZE = 50;
    let cardboard = 300, baseHealth = 20, gameOver = false, frameCount = 0, animId = null;
    
    // Wave & AutoPlay variables
    let currentWave = 1, waveActive = false, waveWaiting = true, autoPlay = false;
    let enemiesToSpawn = [], spawnTimer = 0;
    
    let enemies = [], towers = [], projectiles = [], currentMap = [], currentWaypoints = [], dockPos = {x: 0, y: 0};
    
    let ACTIVE_TOWERS = []; 
    let currentTowerTypeIndex = 0;
    let selectedPlacedTower = null;

    // --- RESPONSIVE SCALING LOGIC ---
    function resizeGame() {
        if (gameWrapper.style.display !== 'flex') return;
        const scaleX = window.innerWidth / 1150; 
        const scaleY = window.innerHeight / 600; 
        const scale = Math.min(scaleX, scaleY);
        gameContainer.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);

    function navTo(screenId) {
        document.querySelectorAll('.menu-screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function setHero(i) {
        selectedHeroIdx = i;
        document.getElementById('hero-btn-0').classList.toggle('active', i === 0);
        document.getElementById('hero-btn-1').classList.toggle('active', i === 1);
    }
    function selectMap(i) { selectedMapIdx = i; navTo('screen-diff'); }
    function selectDiff(i) { selectedDiffIdx = i; initHostGame(); }
    window.toggleSettings = () => {
        const modal = document.getElementById('settings-modal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    };

    window.toggleAutoPlay = () => {
        autoPlay = !autoPlay;
        const btn = document.getElementById('autoplay-btn');
        btn.innerText = autoPlay ? "AUTO PLAY: ON" : "AUTO PLAY: OFF";
        btn.style.backgroundColor = autoPlay ? "#2ecc71" : "#e74c3c";
        btn.style.borderColor = autoPlay ? "#27ae60" : "#c0392b";
        if (autoPlay && !waveActive && waveWaiting && isHost) startNextWave();
    };

    // --- DATA DEFINITIONS ---
    const HEROES = [
        { id: 'h0', isHero: true, name: "Foreman Fred", cost: 650, range: 150, damage: 15, cd: 45, color: '#f39c12', pColor: '#e67e22', aoeRadius: 0, type: 'turret',
          onLevel: (t) => { t.baseDamage += 5; t.baseRange += 5; }
        },
        { id: 'h1', isHero: true, name: "Safety Sue", cost: 550, range: 180, damage: 25, cd: 60, color: '#e74c3c', pColor: '#c0392b', aoeRadius: 40, type: 'turret',
          onLevel: (t) => { t.baseDamage += 8; t.config.aoeRadius += 5; t.baseCd *= 0.95; }
        }
    ];

    const TOWER_DB = [
        { id: 't0', name: "Counterbalance", cost: 150, range: 120, damage: 10, cd: 40, color: '#3498db', pColor: '#2980b9', aoeRadius: 0, type: 'turret',

    function hostGame() {
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        peer = new Peer('pallet-' + code);
        peer.on('open', () => { document.getElementById('network-status').innerText = "Match Code: " + code + " (Waiting for P2)"; });
        peer.on('connection', conn => { networkConn = conn; document.getElementById('network-status').innerText = "P2 Joined! Navigating to Map Select..."; setTimeout(() => navTo('screen-maps'), 1500); setupNet(); });
    }

    function joinGame() {
        const code = document.getElementById('join-id').value.toUpperCase().trim();
        if(code.length !== 5) return alert("Enter 5-letter code!");
        isHost = false; document.getElementById('network-status').innerText = "Connecting...";
        peer = new Peer();
        peer.on('open', () => {
            networkConn = peer.connect('pallet-' + code);
            networkConn.on('open', () => { document.getElementById('network-status').innerText = "Connected! Waiting for Host to select map..."; setupNet(); });
        });
    }

    function setupNet() {
        networkConn.on('data', d => {
            if (isHost) {
                if (d.type === 'BUILD') attemptBuild(d.x, d.y, d.cIdx, false);
                else if (d.type === 'SELL') executeSell(d.x, d.y);
                else if (d.type === 'START_WAVE') startNextWave(); 
                else if (d.type === 'UPGRADE') { const t = towers.find(tw => tw.gridX === d.x && tw.gridY === d.y); if (t) { selectedPlacedTower = t; upgradeTowerPath(d.pIdx); selectedPlacedTower = null; } }
            } else {
                if (d.type === 'START') {
                    currentMap = d.map; currentWaypoints = d.wp; dockPos = d.dock; ACTIVE_TOWERS = d.towers; 
                    showGameUI(); gameLoop(); 
                } else if (d.type === 'SYNC') {
                    cardboard = d.cb; baseHealth = d.hp; currentWave = d.wave; 
                    waveActive = d.wAct; waveWaiting = d.wWait;
                    clientRenderState = d; updateTopUI();
                }
            }
        });
    }

        if (waveActive || !waveWaiting) return;
        if (!isHost) { networkConn.send({ type: 'START_WAVE' }); return; }
        
        waveWaiting = false;
        waveActive = true; 
        enemiesToSpawn = []; 
        let count = 5 + (currentWave * 3);
        
        for (let i=0; i<count; i++) {
            if (currentWave >= 5 && i === count-1 && currentWave % 5 === 0) enemiesToSpawn.push(ENEMY_TYPES.BOSS);
            else if (currentWave >= 3 && Math.random() < 0.3) enemiesToSpawn.push(ENEMY_TYPES.DRONE);
            else if (currentWave >= 2 && Math.random() < 0.4) enemiesToSpawn.push(ENEMY_TYPES.BARREL);
            else enemiesToSpawn.push(ENEMY_TYPES.ROOMBA);
        }
        spawnTimer = 0;
        updateTopUI();
    };

    // --- GAME ENGINE ---
    class Tower {
        constructor(gx, gy, conf, isLocalOwner) {
            this.gridX = gx; this.gridY = gy; this.x = (gx*TILE_SIZE)+25; this.y = (gy*TILE_SIZE)+25;
            this.config = JSON.parse(JSON.stringify(conf)); this.isHero = conf.isHero; this.owner = isLocalOwner;
            this.baseRange = conf.range; this.baseDamage = conf.damage; this.baseCd = conf.cd;
            this.range = this.baseRange; this.damage = this.baseDamage; this.cd = this.baseCd;
            this.timer = 0; this.angle = 0; this.upgrades = [0, 0, 0]; this.level = 1; this.xp = 0;
        }
        update() {
            if (this.timer > 0) this.timer--;
            if (this.isHero && this.config.id === 'h0') { for (let t of towers) { if (t !== this && Math.hypot(t.x-this.x, t.y-this.y) <= this.range) t.cd *= (0.95 - (this.level*0.01)); } }

            let tgt = null; let minD = Infinity;
            for (let e of enemies) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (this.config.type === 'trap' && d < this.range && this.timer === 0 && !e.fly) { e.hp -= this.damage; this.timer = this.cd; } 
                else if (this.config.type === 'turret' && d < this.range && d < minD && !e.fly) { minD = d; tgt = e; }
            }
            if (tgt && this.config.type === 'turret') {
                this.angle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                if (this.timer === 0) { projectiles.push(new Projectile(this.x, this.y, tgt, this)); this.timer = this.cd; }
            }
        }
        addXp(amount) {
            if(!this.isHero || this.level >= 10) return;
            this.xp += amount; let req = this.level * 150;
            if (this.xp >= req) { this.xp -= req; this.level++; let heroTemplate = HEROES.find(h => h.id === this.config.id); if(heroTemplate && heroTemplate.onLevel) heroTemplate.onLevel(this); }
        }
    }

    class Projectile {
        constructor(x, y, tgt, twr) { this.x = x; this.y = y; this.tgt = tgt; this.twr = twr; this.dmg = twr.damage; this.spd = 10; }
        update() {
            if (this.tgt.hp <= 0) return true;
            const d = Math.hypot(this.tgt.x - this.x, this.tgt.y - this.y);
            if (d < this.spd) {
                if (this.twr.config.aoeRadius > 0) { for (let e of enemies) if (Math.hypot(e.x - this.tgt.x, e.y - this.tgt.y) <= this.twr.config.aoeRadius) e.hp -= this.dmg; } 
                else { this.tgt.hp -= this.dmg; }
                return true; 
            } else { this.x += ((this.tgt.x-this.x)/d)*this.spd; this.y += ((this.tgt.y-this.y)/d)*this.spd; return false; }
        }
    }

    function canUpgradePath(twr, pIdx) {
        if (twr.upgrades[pIdx] >= 3) return false;
        let activePaths = twr.upgrades.filter(v => v > 0).length;
        if (twr.upgrades[pIdx] === 0 && activePaths >= 2) return false;

        let sim = [...twr.upgrades]; sim[pIdx]++; sim.sort((a,b)=>b-a);
        if (sim[0] > 3 || sim[1] > 2 || sim[2] > 0) return false;
        return true;
    }

    window.processPathUpgrade = pIdx => {
        if (!selectedPlacedTower) return;
        if (!isHost) { networkConn.send({ type: 'UPGRADE', x: selectedPlacedTower.gridX, y: selectedPlacedTower.gridY, pIdx }); return; }
        upgradeTowerPath(pIdx);
    };

    function upgradeTowerPath(pIdx) {
        const t = selectedPlacedTower;
        if (!canUpgradePath(t, pIdx)) return;
        const upgDef = t.config.paths[pIdx][t.upgrades[pIdx]];
        if (cardboard >= upgDef.c) {
            cardboard -= upgDef.c; t.upgrades[pIdx]++;
            if(upgDef.t === 'dmg') t.baseDamage += upgDef.v; if(upgDef.t === 'cd') t.baseCd *= upgDef.v;
            if(upgDef.t === 'rng') t.baseRange *= upgDef.v; if(upgDef.t === 'aoe') t.config.aoeRadius += upgDef.v;
            t.damage = t.baseDamage; t.cd = t.baseCd; t.range = t.baseRange;
            updateUpgradeUI(); updateTopUI();
        }
    }

    function updateTopUI() {
        document.getElementById('moneyDisplay').innerText = cardboard;
        document.getElementById('healthDisplay').innerText = baseHealth;
        document.getElementById('waveDisplay').innerText = currentWave;

        const pBtn = document.getElementById('play-wave-btn');
        if (waveActive || !waveWaiting) {
            pBtn.disabled = true;
            pBtn.innerHTML = "⏸"; 
        } else {
            pBtn.disabled = false;
            pBtn.innerHTML = autoPlay ? "⏩" : "▶";
        }
    }

    function getTierDots(current, max) { let s = ""; for(let i=0; i<max; i++) s += (i < current) ? "■ " : "□ "; return s; }

    function updateUpgradeUI() {
        const tc = document.getElementById('tower-controls');
        const up = document.getElementById('upgrade-panel');
        const info = document.getElementById('upgrade-info'); 
        const acts = document.getElementById('upgrade-actions');
        
        if (!selectedPlacedTower) { tc.style.display = 'grid'; up.style.display = 'none'; return; }
        
        tc.style.display = 'none'; up.style.display = 'flex';

        const t = selectedPlacedTower;
        document.getElementById('upgrade-title').innerText = t.isHero ? `⭐ ${t.config.name}` : t.config.name;

        let totalValue = t.config.cost;
        if (!t.isHero) { for(let i=0; i<3; i++) { for(let j=0; j<t.upgrades[i]; j++) { totalValue += t.config.paths[i][j].c; } } }
        let sellPrice = Math.floor(totalValue * 0.75);
        document.getElementById('sell-btn').innerText = `Sell for $${sellPrice}`;

        if (t.isHero) {
            let xpPct = t.level >= 10 ? 100 : (t.xp / (t.level*150)) * 100;
            acts.innerHTML = `<div style="text-align:center; margin-top: 10px; font-family:'Fredoka One';">Level: ${t.level} / 10</div><div class="xp-bar-container"><div class="xp-bar-fill" style="width: ${xpPct}%"></div><div class="xp-text">${t.level >= 10 ? 'MAX LEVEL' : t.xp + ' / ' + (t.level*150) + ' XP'}</div></div><div style="font-size:12px; margin-top:5px; text-align:center; color:#3e2717;">Heroes gain XP automatically.</div>`;
            return;
        }

        acts.innerHTML = "";
        for (let i = 0; i < 3; i++) {
            let tier = t.upgrades[i]; let rowCls = "path-row"; 
            let simUpg = [...t.upgrades]; let activePaths = simUpg.filter(v => v > 0).length;
            let locked = (tier === 0 && activePaths >= 2);
            simUpg[i]++; simUpg.sort((a,b)=>b-a); if (simUpg[0]>3 || simUpg[1]>2 || simUpg[2]>0) locked = true;

            let innerHtml = "";
            if (tier >= 3) {
                rowCls += " maxed";
                innerHtml = `<div class="path-row-top"><span>PATH MAXED</span></div><div class="tier-dots">${getTierDots(tier, 3)}</div>`;
            } else if (locked) {
                rowCls += " locked";
                innerHtml = `<div class="path-row-top"><span>PATH LOCKED</span></div><div class="tier-dots">${getTierDots(tier, 3)}</div>`;
            } else {
                let upgDef = t.config.paths[i][tier]; let afford = cardboard >= upgDef.c;
                if (!afford) rowCls += " locked"; 
                innerHtml = `
                    <div class="path-row-top">
                        <span>${upgDef.n}</span>
                        <span style="color:#f1c40f;">$${upgDef.c}</span>
                    </div>
                    <div class="tier-dots">${getTierDots(tier, 3)}</div>
                `;
            }

            acts.innerHTML += `<div class="${rowCls}" onclick="${(!locked && tier<3) ? `processPathUpgrade(${i})` : ''}">${innerHtml}</div>`;
        }
    }

    canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const gX = Math.floor(((e.clientX - rect.left) * scaleX) / TILE_SIZE);
        const gY = Math.floor(((e.clientY - rect.top) * scaleY) / TILE_SIZE);

        if(gX < 0 || gX > 15 || gY < 0 || gY > 10) { deselectTower(); return; }

        let clickedTower = isHost ? towers.find(t => t.gridX === gX && t.gridY === gY) : (clientRenderState ? clientRenderState.t.find(t => t.gridX === gX && t.gridY === gY) : null);
        
        if (clickedTower) { selectedPlacedTower = clickedTower; updateUpgradeUI(); return; }
        if (selectedPlacedTower) { deselectTower(); return; }

        if (isHost) attemptBuild(gX, gY, currentTowerTypeIndex, true);
        else networkConn.send({ type: 'BUILD', x: gX, y: gY, cIdx: currentTowerTypeIndex });
    });

    function attemptBuild(gx, gy, cIdx, isLocal) {
        const conf = ACTIVE_TOWERS[cIdx];
        if (conf.isHero && towers.filter(t => t.config.id === conf.id && t.owner === isLocal).length >= 1) return;
        
        const onPath = currentMap[gy][gx] === 1; const onEmpty = currentMap[gy][gx] === 0;
        if ((conf.type === 'trap' && onPath) || (conf.type !== 'trap' && onEmpty)) {
            if (cardboard >= conf.cost) {
                towers.push(new Tower(gx, gy, conf, isLocal)); currentMap[gy][gx] = 2; 
                cardboard -= conf.cost; updateTopUI(); selectedPlacedTower = null; updateUpgradeUI();
            }
        }
    }

    // --- RENDER & GAME LOOP ---
    function drawBaseMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let r = 0; r < currentMap.length; r++) {
            for (let c = 0; c < currentMap[r].length; c++) {
                if (currentMap[r][c] === 1) { ctx.fillStyle = '#ecf0f1'; ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE); ctx.fillStyle = '#bdc3c7'; ctx.fillRect(c * TILE_SIZE + 5, r * TILE_SIZE + 5, TILE_SIZE-10, TILE_SIZE-10); }
            }
        }
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(dockPos.gridX*TILE_SIZE, dockPos.gridY*TILE_SIZE, 50, 50);
        ctx.fillStyle = 'white'; ctx.font = '14px "Fredoka One"'; ctx.fillText("DOCK", dockPos.gridX*TILE_SIZE + 5, dockPos.gridY*TILE_SIZE + 30);
    }

    // DISTINCT FORKLIFT ART
    function drawEntities(tList, eList, pList) {
        if(selectedPlacedTower) { ctx.fillStyle='rgba(236,240,241,0.3)'; ctx.beginPath(); ctx.arc((selectedPlacedTower.gridX*TILE_SIZE)+25, (selectedPlacedTower.gridY*TILE_SIZE)+25, selectedPlacedTower.range || selectedPlacedTower.rng, 0, Math.PI*2); ctx.fill(); }
        
        for (let t of tList) {
            ctx.save(); ctx.translate(t.x || (t.gridX*TILE_SIZE)+25, t.y || (t.gridY*TILE_SIZE)+25);
            if (t.config?.type !== 'aura') ctx.rotate(t.angle || t.a || 0);

            let typeId = t.config?.id || t.id;
            let color = t.config?.color || t.c;

            if (t.isHero || t.h) {
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0,0, 18, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(-8,-8, 16,16);
                ctx.fillStyle = '#f1c40f'; ctx.font="14px Arial"; ctx.fillText("⭐", -8, 5);
            } else if (typeId === 't0') { // Counterbalance
                ctx.fillStyle = color; ctx.fillRect(-15, -15, 30, 30);
                ctx.fillStyle = '#bdc3c7'; ctx.fillRect(15, -10, 15, 4); ctx.fillRect(15, 6, 15, 4); // Forks
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(-5, -10, 10, 20); // Cab
            } else if (typeId === 't1') { // Telehandler
                ctx.fillStyle = color; ctx.fillRect(-18, -12, 36, 24);
                ctx.fillStyle = '#e67e22'; ctx.fillRect(-10, -5, 35, 10); // Boom arm
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, -10, 12, 10); // Cab offset
            } else if (typeId === 't2') { // Pallet Jack
                ctx.fillStyle = color; ctx.fillRect(-10, -8, 20, 16);
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(10, -6, 12, 3); ctx.fillRect(10, 3, 12, 3); // Small forks
                ctx.fillStyle = 'black'; ctx.fillRect(-15, -2, 5, 4); // Handle
            } else if (typeId === 't3') { // Order Picker
                ctx.fillStyle = color; ctx.fillRect(-12, -15, 24, 30);
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(5, 0, 8, 0, Math.PI*2); ctx.fill(); // Operator cage
                ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.stroke();
            } else if (typeId === 't4') { // Electric Stacker
                ctx.fillStyle = color; ctx.fillRect(-15, -12, 20, 24);
                ctx.fillStyle = '#ecf0f1'; ctx.fillRect(5, -10, 5, 20); // Mast
                ctx.fillStyle = '#95a5a6'; ctx.fillRect(10, -8, 10, 4); ctx.fillRect(10, 4, 10, 4); // Forks
            } else if (typeId === 't5') { // Heavy Crane
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0,0, 20, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, -6, 40, 12); // Crane arm
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(40, 0, 6, 0, Math.PI*2); ctx.fill(); // Wrecking ball
            } else {
                ctx.fillStyle = color; ctx.fillRect(-15, -15, 30, 30); ctx.fillStyle = '#2c3e50'; ctx.fillRect(-5, -5, 10, 10);
            }

            let upgs = t.upgrades || t.u;
            if (upgs) {
                let maxT = Math.max(...upgs); ctx.fillStyle = '#2ecc71';
                if (maxT >= 1) ctx.fillRect(-15, -15, 4, 10); if (maxT >= 2) ctx.fillRect(-15, -5, 4, 10); if (maxT >= 3) ctx.fillRect(-15, 5, 4, 10);
            }
            ctx.restore();
        }
        for (let p of pList) { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); }
        for (let e of eList) {
            ctx.fillStyle = e.color || e.c; ctx.beginPath(); ctx.arc(e.x, e.y, e.rad || e.r, 0, Math.PI * 2); ctx.fill();
            if (e.fly) { ctx.strokeStyle = 'white'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(e.x-10, e.y-10); ctx.lineTo(e.x+10, e.y+10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.x+10, e.y-10); ctx.lineTo(e.x-10, e.y+10); ctx.stroke(); } 
            else { ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth=2; ctx.stroke(); }
            ctx.lineWidth=1; ctx.fillStyle = 'black'; ctx.fillRect(e.x - 11, e.y - 21, 22, 6); ctx.fillStyle = 'red'; ctx.fillRect(e.x - 10, e.y - 20, 20, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(e.x - 10, e.y - 20, 20 * Math.max(0, (e.hp||0) / (e.maxHp||1)), 4);
        }
    }

    function gameLoop() {
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = 'white'; ctx.font = '40px "Fredoka One"'; ctx.shadowColor = 'black'; ctx.shadowBlur = 10;
            ctx.fillText(`GAME OVER - Round ${currentWave}`, 170, 250); ctx.shadowBlur = 0; return;
        }
        drawBaseMap();

        if (!isHost) {
            if (clientRenderState) { drawEntities(clientRenderState.t, clientRenderState.e, clientRenderState.p); }
            animId = requestAnimationFrame(gameLoop); return;
        }

        if (waveActive) {
            spawnTimer--;
            if (spawnTimer <= 0 && enemiesToSpawn.length > 0) {
                let eConf = enemiesToSpawn.shift(); let e = { x: currentWaypoints[0].x, y: currentWaypoints[0].y, wpIdx: 1, maxHp: eConf.hp * (1+(currentWave*0.15)), speed: eConf.spd, rad: eConf.rad, color: eConf.color, reward: eConf.reward, fly: eConf.fly };
                e.hp = e.maxHp; enemies.push(e); spawnTimer = 35 - Math.min(20, currentWave); 
            } else if (enemiesToSpawn.length === 0 && enemies.length === 0) {
                waveActive = false; waveWaiting = true; currentWave++; cardboard += 50 + (currentWave * 10); 
                towers.forEach(t => t.addXp(100 + (currentWave*20))); updateTopUI(); if(selectedPlacedTower) updateUpgradeUI();
                
                // AUTO PLAY LOGIC
                if (autoPlay && isHost) {
                    setTimeout(() => { if(autoPlay && waveWaiting) startNextWave(); }, 1500);
                }
            }
        }

        for (let t of towers) { t.damage = t.baseDamage; t.cd = t.baseCd; }
        for (let t of towers) t.update();
        for (let i = projectiles.length - 1; i >= 0; i--) if (projectiles[i].update()) projectiles.splice(i, 1);
        
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            const tgt = currentWaypoints[e.wpIdx]; const dx = tgt.x - e.x; const dy = tgt.y - e.y; const dist = Math.hypot(dx, dy);
            if (dist < e.speed) { e.x = tgt.x; e.y = tgt.y; e.wpIdx++; } else { e.x += (dx/dist)*e.speed; e.y += (dy/dist)*e.speed; }

            if (e.wpIdx >= currentWaypoints.length) { baseHealth -= (e.maxHp > 150 ? 5 : 1); updateTopUI(); enemies.splice(i, 1); if (baseHealth <= 0) gameOver = true; continue; }
            if (e.hp <= 0) { cardboard += e.reward; updateTopUI(); enemies.splice(i, 1); }
        }

        drawEntities(towers, enemies, projectiles);

        if (networkConn && networkConn.open && frameCount % 2 === 0) {
            networkConn.send({
                type: 'SYNC', cb: cardboard, hp: baseHealth, wave: currentWave, wAct: waveActive, wWait: waveWaiting,
                e: enemies.map(e => ({x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, r: e.rad, c: e.color, fly: e.fly})),
                t: towers.map(t => ({gridX: t.gridX, gridY: t.gridY, a: t.angle, rng: t.range, c: t.config.color, u: t.upgrades, h: t.isHero, level: t.level, xp: t.xp, config: t.config, id: t.config.id })),
                p: projectiles.map(p => ({x: p.x, y: p.y, c: p.twr.config.pColor}))
            });
        }
        frameCount++; animId = requestAnimationFrame(gameLoop);
    }
</script>
